services:
  mongo:
    image: mongo:7
    container_name: trace-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: trace_demo

  neo4j:
    image: neo4j:5-community
    container_name: trace-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474" # browser UI
      - "7687:7687" # bolt
    environment:
      NEO4J_AUTH: neo4j/trace-local-dev
      NEO4J_PLUGINS: '[]'
    volumes:
      - neo4j_data:/data

  backend:
    build: ./backend
    container_name: trace-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: trace_demo
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: trace-local-dev
      # Ollama stays native on the host (plan §1, §4): GPU passthrough isn't needed.
      OLLAMA_HOST: http://host.docker.internal:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b-instruct}
      ASR_MODEL_SIZE: ${ASR_MODEL_SIZE:-small}
      ASR_DEVICE: cpu
      CACHE_DIR: /data/cache
      # Set to http://<laptop LAN IP>:3000 so the QR code opens from a phone.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
      DEMO_CACHE: ${DEMO_CACHE:-1}
      BNS_MODE: ${BNS_MODE:-fixture}
      # Jurisdiction Lookup: the key comes from the git-ignored .env file next to this one.
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      JURISDICTION_ONLINE: ${JURISDICTION_ONLINE:-1}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./cache:/data/cache
      - whisper_models:/models
    depends_on:
      - mongo
      - neo4j

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8000
    container_name: trace-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  mongo_data:
  neo4j_data:
  whisper_models:
